name: Compile and Deploy PDF

on:
  push:
    paths:
      - '**/*.tex'
      - '**/*.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile all LaTeX files
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            resume.tex
            cv.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -outdir=output
          post_compile: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=output -jobname=resume-inverted resume.tex

      - name: Keep only PDFs
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          find output -type f ! -name '*.pdf' -delete

      - name: Deploy PDFs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: output
          force_orphan: true
